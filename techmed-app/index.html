<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechMed</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>TechMed</h1>

  <form id="medForm">
    <input type="text" id="nome" placeholder="Nome do paciente" required />
    <input type="text" id="remedio" placeholder="Remédio" required />
    <input type="number" id="quantidade" placeholder="Qtd. por dia" required />
    <input type="time" id="horario" required />
    <input type="date" id="data" required />
    <button type="submit">Adicionar</button>
  </form>

  <h2>Cadastros</h2>
  <ul id="listaCadastros"></ul>

  <script src="script.js"></script>
</body>
<script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
  
</html>
